//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
}

version = "$baseVersion+$branch"
archivesBaseName = project.slug

repositories {
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.enginehub.org/repo/" }
	mavenCentral()
}

configurations {
	shade
}

dependencies {
	minecraft libs.mc
	mappings variantOf(libs.yarn) { classifier "v2" }
	modImplementation libs.fl
	modImplementation libs.fapi

	modImplementation libs.sodium

	modImplementation libs.nettyIoUringClasses
	modImplementation variantOf(libs.nettyIoUringNative) { classifier "linux-x86_64" }
	modImplementation libs.zstd

	modImplementation libs.worldeditCore
	modImplementation libs.worldeditFabric

	shade(libs.nettyIoUringClasses) { transitive = false }
	shade(variantOf(libs.nettyIoUringNative) { classifier "linux-x86_64" }) { transitive = false }
	shade(libs.zstd) { transitive = false }
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}. Contributions by ${contributors}",
		mc            : compatibleVersions.split(", ")[0],
		fl            : libs.versions.fl.get(),
		fapi          : libs.versions.fapi.get()
	]
	inputs.properties(meta)
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

loom {
	accessWidenerPath = file("src/main/resources/fireblanket.accesswidener")
}

sourceSets {
	dummy {
		compileClasspath += sourceSets.main.compileClasspath
	}
	main {
		compileClasspath += sourceSets.dummy.output
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${archivesBaseName}" }
	}

	configurations.shade.resolve().each {
		from(zipTree(it)) {
			exclude 'META-INF/MANIFEST.MF'
			exclude 'META-INF/INDEX.LIST'
			exclude 'META-INF/maven/**'
		}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
