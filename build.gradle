//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
}

version = "$baseVersion+$branch"

base {
	archivesName = project.slug
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.enginehub.org/repo/" }
	maven { url = "https://maven.gegy.dev/releases/" }
	maven { url = "https://maven.bawnorton.com/releases" }
	maven { url = "https://maven.createmod.net/" }
	mavenCentral()
}

configurations {
	shade
}

dependencies {
	minecraft libs.mc
	implementation libs.fl
	implementation libs.fapi

	//modImplementation libs.sodium
	//modImplementation libs.flywheel
	//modImplementation libs.vanillin

	implementation libs.nettyIoUringClasses
	implementation variantOf(libs.nettyIoUringNative) { classifier "linux-x86_64" }
	implementation libs.zstd

	// This will *not* boot and you know it
	compileOnly(libs.bundles.worldedit) {
		exclude group: "it.unimi.dsi"
		exclude group: "com.google.code.gson"
		exclude group: "com.google.guava"
		exclude group: "org.apache.logging.log4j"
	}

	// TODO: update this when it's actually released
	//  The API is currently mimicked in the meantime.
	// implementation "dev.gegy:player-roles-api:1.6.15"

	shade(libs.nettyIoUringClasses) { transitive = false }
	shade(variantOf(libs.nettyIoUringNative) { classifier "linux-x86_64" }) { transitive = false }
	shade(libs.zstd) { transitive = false }

	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.3")))
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}. Contributions by ${contributors}",
		mc            : compatibleVersions.split(", ")[0],
		fl            : libs.versions.fl.get(),
		fapi          : libs.versions.fapi.get()
	]
	inputs.properties(meta)
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs += "-Xlint:deprecation,unchecked,rawtypes"
}

loom {
	accessWidenerPath = file("src/main/resources/fireblanket.accesswidener")
}

sourceSets {
	dummy {
		compileClasspath += sourceSets.main.compileClasspath
	}
	main {
		compileClasspath += sourceSets.dummy.output
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}

	configurations.shade.resolve().each {
		from(zipTree(it)) {
			exclude 'META-INF/MANIFEST.MF'
			exclude 'META-INF/INDEX.LIST'
			exclude 'META-INF/maven/**'
			// Unnecessary module-info.class
			exclude 'META-INF/versions/**'
			exclude 'META-INF/io.netty.versions.properties'
		}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

test {
	failOnNoDiscoveredTests = false
}
